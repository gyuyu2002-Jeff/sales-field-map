name: Data format and application regression checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/update_government_data.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check reproducible build
        run: git diff --exit-code -- index.html data/
