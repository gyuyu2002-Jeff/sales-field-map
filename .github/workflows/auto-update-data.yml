name: 每月定時自動同步政府公開工廠資料 (Monthly Government Data Sync)

on:
  schedule:
    # 每月 1 號 台灣時間上午 10:00 (UTC 02:00) 自動執行
    - cron: '0 2 1 * *'
  workflow_dispatch:
    # 支援隨時手動一鍵觸發
    inputs:
      force_update:
        description: '是否強制重新全量審計與編譯'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行政府公開資料同步機器人
        run: |
          python scripts/update_government_data.py

      - name: 檢查資料庫變更並自動提交推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有檔案異動
          if [[ -n $(git status -s all_taoyuan_parks.json index.html) ]]; then
            echo "檢測到資料更新，準備自動 Commit & Push..."
            git add all_taoyuan_parks.json index.html README.md
            git commit -m "chore(bot): 每月定時自動同步政府公開工廠資料庫 ($(date +'%Y-%m'))"
            git push origin main
            echo "✅ 已成功推送更新至 GitHub！GitHub Pages 即將自動部署。"
          else
            echo "ℹ️ 目前各園區資料皆為最新，無須重複提交。"
          fi
