<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>業務外勤拜訪地圖 - 中壢產業園區巡訪指南</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #FCFBF8;
      --navy: #16213A;
      --navy-light: #2A3859;
      --blue: #1A4DA1;
      --blue-subtle: #EEF3FC;
      --accent-orange: #E0622B;
      --accent-green: #2E8540;
      --accent-purple: #7033FF;
      --border: #E6E3DB;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background: #FFFFFF;
      border-bottom: 1.5px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1000;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: var(--navy);
      color: #FFF;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
    }

    .brand-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--navy);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--blue-subtle);
      border-color: var(--blue);
      color: var(--blue);
    }

    .btn-primary {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--blue);
      color: #FFFFFF;
    }

    /* Main Container (Split Screen) */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      position: relative;
      overflow: hidden;
    }

    /* Sidebar (Client Cards & Filtering) */
    .sidebar {
      width: 440px;
      background: var(--bg-primary);
      border-right: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(22, 33, 58, 0.04);
    }

    .sidebar-controls {
      padding: 14px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      background: #FAFAF8;
    }

    .search-box input:focus {
      border-color: var(--blue);
      background: #FFF;
      box-shadow: 0 0 0 3px rgba(26, 77, 161, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* Road Filter Chips (關鍵：讓業務看同一條路上有誰) */
    .road-chips-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .chips-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .chips-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .chip {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      background: #F1EFE7;
      color: var(--navy);
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .chip:hover {
      background: #E8E5DC;
    }

    .chip.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .status-chips-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip-status.active-all { background: var(--navy); color: #fff; }
    .chip-status.active-listed { background: var(--accent-orange); color: #fff; }
    .chip-status.active-pending { background: var(--blue); color: #fff; }
    .chip-status.active-done { background: var(--accent-green); color: #fff; }
    .chip-status.active-negotiating { background: var(--accent-purple); color: #fff; }

    /* Client List View */
    .client-list-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: #F9F8F5;
      border-bottom: 1px solid var(--border);
    }

    .client-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Client Card */
    .client-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .client-card:hover {
      border-color: var(--blue);
      box-shadow: 0 4px 16px rgba(22, 33, 58, 0.08);
      transform: translateY(-1.5px);
    }

    .client-card.active {
      border-color: var(--blue);
      background: #F8FAFD;
      box-shadow: 0 0 0 2px var(--blue);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.4;
    }

    .badge-listed {
      background: #FFF4E5;
      color: var(--accent-orange);
      border: 1px solid #FDCB9E;
      font-size: 10.5px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .badge-industry {
      background: #F3F4F6;
      color: #4B5563;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .card-address {
      font-size: 12.5px;
      color: #4B5563;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-road {
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-subtle);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #6B7280;
    }

    .card-meta a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .card-meta a:hover {
      text-decoration: underline;
    }

    .card-notes {
      font-size: 12px;
      color: #4B5563;
      background: #FBF9F4;
      padding: 7px 10px;
      border-radius: 6px;
      border-left: 3px solid #D6D0C2;
      line-height: 1.5;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .status-select {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFF;
      cursor: pointer;
      outline: none;
    }

    .status-pending { color: var(--blue); border-color: var(--blue); background: var(--blue-subtle); }
    .status-done { color: var(--accent-green); border-color: var(--accent-green); background: #EBF7EE; }
    .status-negotiating { color: var(--accent-purple); border-color: var(--accent-purple); background: #F3ECFF; }

    .nav-btn {
      background: var(--accent-orange);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }

    .nav-btn:hover {
      background: #C44C17;
    }

    /* Map View */
    #map {
      flex: 1;
      height: 100%;
      background: #E5E3DF;
      z-index: 10;
    }

    /* Custom Leaflet Markers */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #FFF;
      font-weight: 900;
      font-size: 11px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }

    .custom-marker:hover {
      transform: scale(1.2);
    }

    .marker-listed { background: var(--accent-orange); }
    .marker-pending { background: var(--blue); }
    .marker-done { background: var(--accent-green); }
    .marker-negotiating { background: var(--accent-purple); }

    /* Map overlay controls */
    .map-controls-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-tool-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      color: var(--navy);
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(22, 33, 58, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-tool-btn:hover {
      background: #FAFAF7;
      border-color: var(--navy);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(22, 33, 58, 0.6);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h3 {
      font-size: 18px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--navy);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
    }

    /* Mobile toggle tab */
    .mobile-tab-bar {
      display: none;
    }

    @media (max-width: 820px) {
      .app-container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 52%;
        order: 2;
        border-right: none;
        border-top: 2px solid var(--border);
      }

      #map {
        height: 48%;
        order: 1;
      }

      header {
        padding: 8px 12px;
      }

      .brand-title {
        font-size: 16px;
      }

      .btn {
        padding: 6px 9px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="brand">
      <div class="brand-logo">📍</div>
      <div>
        <div class="brand-title">業務巡訪地圖系統</div>
        <div class="brand-subtitle">中壢產業園區 · 快速標註與拜訪動線</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="btnExport" title="匯出當前拜訪狀態為 CSV 檔">
        📤 匯出記錄
      </button>
      <button class="btn" id="btnImport" title="匯入客製化客戶名單 CSV">
        📥 匯入名單
      </button>
      <button class="btn btn-primary" id="btnAddClient">
        ➕ 新增客戶
      </button>
      <input type="file" id="fileInput" accept=".csv" style="display: none;" />
    </div>
  </header>

  <!-- Main Split Container -->
  <div class="app-container">
    
    <!-- Sidebar: Search & Client Cards -->
    <aside class="sidebar">
      
      <div class="sidebar-controls">
        <!-- Search bar -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="搜尋客戶名稱、地址、聯絡人、路名..." />
        </div>

        <!-- Filter 1: By Road (業務外勤最實用：看同一條路有哪些廠) -->
        <div class="road-chips-container">
          <div class="chips-label">📍 同路巡訪快篩（同一條路上順路拜訪）</div>
          <div class="chips-scroll" id="roadChips">
            <button class="chip active" data-road="ALL">全部路段</button>
            <button class="chip" data-road="中園路">中園路</button>
            <button class="chip" data-road="西園路">西園路</button>
            <button class="chip" data-road="吉林路">吉林路</button>
            <button class="chip" data-road="東園路">東園路</button>
            <button class="chip" data-road="自強一路">自強一路</button>
            <button class="chip" data-road="定安路">定安路</button>
          </div>
        </div>

        <!-- Filter 2: By Visit Status & Tier -->
        <div class="road-chips-container">
          <div class="chips-label">🎯 狀態與等級</div>
          <div class="status-chips-scroll" id="statusChips">
            <button class="chip chip-status active-all" data-status="ALL">全部 (<span id="countAll">0</span>)</button>
            <button class="chip chip-status" data-status="LISTED">⭐ 上市櫃重點 (<span id="countListed">0</span>)</button>
            <button class="chip chip-status" data-status="尚未拜訪">⏳ 尚未拜訪 (<span id="countPending">0</span>)</button>
            <button class="chip chip-status" data-status="洽談中">💬 洽談中 (<span id="countNegotiating">0</span>)</button>
            <button class="chip chip-status" data-status="已拜訪">✅ 已拜訪 (<span id="countDone">0</span>)</button>
          </div>
        </div>
      </div>

      <!-- Result Count Header -->
      <div class="client-list-header">
        <span id="resultCountText">顯示 0 家廠商</span>
        <button id="btnResetFilter" style="background:none; border:none; color:var(--blue); font-size:11.5px; font-weight:700; cursor:pointer;">重設篩選</button>
      </div>

      <!-- List of Clients -->
      <div class="client-list" id="clientList">
        <!-- Rendered by JavaScript -->
      </div>
    </aside>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Map Floating Tools -->
    <div class="map-controls-panel">
      <button class="map-tool-btn" id="btnLocateMe" title="取得您手機或設備目前的 GPS 位置">
        🎯 我的位置
      </button>
      <button class="map-tool-btn" id="btnFitBounds" title="縮放顯示全部標記點">
        🗺️ 全區視野
      </button>
    </div>

  </div>

  <!-- Modal: 新增客戶 -->
  <div class="modal-overlay" id="modalAdd">
    <div class="modal-card">
      <h3>➕ 新增拜訪客戶</h3>
      <form id="formAddClient">
        <div class="form-group">
          <label>公司 / 廠房名稱 *</label>
          <input type="text" id="addName" required placeholder="例如：台達電子工業 (中壢二廠)" />
        </div>
        <div class="form-group">
          <label>所在路段 *</label>
          <input type="text" id="addRoad" required placeholder="例如：中園路、吉林路" />
        </div>
        <div class="form-group">
          <label>完整地址 *</label>
          <input type="text" id="addAddress" required placeholder="桃園市中壢區..." />
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>緯度 (Lat) *</label>
            <input type="number" step="0.0001" id="addLat" value="24.9818" required />
          </div>
          <div class="form-group" style="flex:1;">
            <label>經度 (Lng) *</label>
            <input type="number" step="0.0001" id="addLng" value="121.2385" required />
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>聯絡窗口</label>
            <input type="text" id="addContact" placeholder="例如：陳廠長" />
          </div>
          <div class="form-group" style="flex:1;">
            <label>聯絡電話</label>
            <input type="text" id="addPhone" placeholder="例如：03-452-xxxx" />
          </div>
        </div>
        <div class="form-group">
          <label>上市櫃指標企業？</label>
          <select id="addListed">
            <option value="否">否 (一般企業)</option>
            <option value="是">是 (上市櫃大廠)</option>
          </select>
        </div>
        <div class="form-group">
          <label>拜訪備忘錄 / 洽談重點</label>
          <textarea id="addNotes" rows="3" placeholder="記錄該客戶需求、門禁限制或產品詢價重點..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
          <button type="button" class="btn" id="btnCloseModal">取消</button>
          <button type="submit" class="btn btn-primary">儲存建立</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // --- 預設中壢產業園區真實代表廠家資料庫 ---
    const DEFAULT_CLIENTS = [
      { id: 1, name: "台達電子工業 (中壢一廠)", road: "中園路", address: "桃園市中壢區中園路二段168號", lat: 24.9782, lng: 121.2421, industry: "電子零組件", is_listed: "是", status: "尚未拜訪", contact: "張廠長", phone: "03-452-6107", notes: "預計拜訪討論智慧製造與產線電力升級需求" },
      { id: 2, name: "欣興電子 (合庫廠)", road: "中園路", address: "桃園市中壢區中園路178號", lat: 24.9791, lng: 121.2415, industry: "印刷電路板", is_listed: "是", status: "尚未拜訪", contact: "李協理", phone: "03-492-6666", notes: "已建立初步聯繫，待提供報價" },

      { id: 24, name: "高力熱處理工業", road: "定安路", address: "桃園市中壢區定安路32號", lat: 24.9875, lng: 121.2425, industry: "熱交換器", is_listed: "是", status: "尚未拜訪", contact: "彭副總", phone: "03-452-7777", notes: "熱泵、板式熱交換器與伺服器水冷分歧管" }
    ];

    // --- State Management ---
    let clients = [];
    let activeRoad = "ALL";
    let activeStatus = "ALL";
    let searchQuery = "";
    let map = null;
    let markers = {};
    let userLocationMarker = null;

    // Load from LocalStorage or initialize with DEFAULT_CLIENTS
    function initData() {
      // 清除舊版快取以確保全部為「尚未拜訪」
      try { localStorage.removeItem("sales_visit_clients_v1"); } catch(e){}
      const stored = localStorage.getItem("sales_visit_clients_v2");
      if (stored) {
        try {
          clients = JSON.parse(stored);
        } catch (e) {
          clients = [...DEFAULT_CLIENTS];
        }
      } else {
        clients = [...DEFAULT_CLIENTS];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem("sales_visit_clients_v2", JSON.stringify(clients));
    }

    // --- Initialize Leaflet Map ---
    function initMap() {
      // 中壢工業區中心座標約 24.9818, 121.2385
      map = L.map('map', {
        zoomControl: true,
        attributionControl: false
      }).setView([24.9818, 121.2385], 15);

      // OpenStreetMap 乾淨圖層
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      // 自定義版權標記
      L.control.attribution({ position: 'bottomright' })
        .addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>')
        .addTo(map);
    }

    // --- Render Markers on Map ---
    function updateMarkers(filteredClients) {
      // Clear existing markers
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};

      const bounds = L.latLngBounds();

      filteredClients.forEach(c => {
        let markerClass = "marker-pending";
        if (c.status === "已拜訪") markerClass = "marker-done";
        else if (c.status === "洽談中") markerClass = "marker-negotiating";
        else if (c.is_listed === "是") markerClass = "marker-listed";

        const iconHtml = `<div class="custom-marker ${markerClass}" style="width:28px;height:28px;">${c.is_listed === '是' ? '★' : '●'}</div>`;
        const customIcon = L.divIcon({
          html: iconHtml,
          className: '',
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14]
        });

        const marker = L.marker([c.lat, c.lng], { icon: customIcon }).addTo(map);

        const popupContent = `
          <div style="font-family:'Noto Sans TC',sans-serif; min-width:180px;">
            <div style="font-weight:800; font-size:14px; color:#16213A; margin-bottom:4px;">
              ${c.name}
            </div>
            <div style="font-size:11px; color:#68717F; margin-bottom:6px;">
              ${c.address}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
              <span style="font-size:11px; font-weight:700; color:#1A4DA1;">${c.road}</span>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.address)}" 
                 target="_blank" 
                 style="font-size:11px; background:#E0622B; color:#fff; text-decoration:none; padding:3px 8px; border-radius:4px; font-weight:700;">
                 🚗 導航
              </a>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);

        marker.on('click', () => {
          highlightClientCard(c.id);
        });

        markers[c.id] = marker;
        bounds.extend([c.lat, c.lng]);
      });

      // Fit map if we have markers
      if (filteredClients.length > 0 && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      }
    }

    // --- Render Client Cards in Sidebar ---
    function renderList() {
      const container = document.getElementById('clientList');
      container.innerHTML = "";

      // Filtering logic
      const filtered = clients.filter(c => {
        // Road Filter
        if (activeRoad !== "ALL" && c.road !== activeRoad) return false;

        // Status Filter
        if (activeStatus === "LISTED" && c.is_listed !== "是") return false;
        if (activeStatus !== "ALL" && activeStatus !== "LISTED" && c.status !== activeStatus) return false;

        // Search Query
        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const matchName = c.name.toLowerCase().includes(q);
          const matchAddr = c.address.toLowerCase().includes(q);
          const matchRoad = c.road.toLowerCase().includes(q);
          const matchContact = (c.contact || "").toLowerCase().includes(q);
          const matchNotes = (c.notes || "").toLowerCase().includes(q);
          if (!matchName && !matchAddr && !matchRoad && !matchContact && !matchNotes) return false;
        }

        return true;
      });

      // Update counters
      document.getElementById('resultCountText').innerText = `顯示 ${filtered.length} / ${clients.length} 家廠商`;
      updateBadgeCounts();

      // Update map pins
      updateMarkers(filtered);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px 20px; color:#6B7280;">
            <div style="font-size:32px; margin-bottom:8px;">🔍</div>
            <div style="font-weight:700;">找不到符合條件的廠商</div>
            <div style="font-size:12px; margin-top:4px;">請嘗試清空搜尋字詞或切換篩選路段</div>
          </div>
        `;
        return;
      }

      // Render items
      filtered.forEach(c => {
        const card = document.createElement('div');
        card.className = "client-card";
        card.id = `card-${c.id}`;

        let statusClass = "status-pending";
        if (c.status === "已拜訪") statusClass = "status-done";
        else if (c.status === "洽談中") statusClass = "status-negotiating";

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">${c.name}</div>
            ${c.is_listed === '是' ? '<span class="badge-listed">★ 上市櫃</span>' : ''}
          </div>

          <div class="card-address">
            <span class="card-road">${c.road}</span>
            <span>${c.address}</span>
          </div>

          <div class="card-meta">
            <span>👤 ${c.contact || '無聯絡人'}</span>
            ${c.phone ? `<span>📞 <a href="tel:${c.phone}">${c.phone}</a></span>` : ''}
            <span class="badge-industry">${c.industry}</span>
          </div>

          <div class="card-notes" title="點擊卡片可查看地圖位置">
            📝 <strong>備忘：</strong><span id="note-text-${c.id}">${c.notes || '尚未填寫拜訪紀錄'}</span>
          </div>

          <div class="card-actions">
            <div>
              <select class="status-select ${statusClass}" onchange="changeClientStatus(${c.id}, this.value, event)">
                <option value="尚未拜訪" ${(c.status === '尚未拜訪' || c.status === '待拜訪') ? 'selected' : ''}>⏳ 尚未拜訪</option>
                <option value="洽談中" ${c.status === '洽談中' ? 'selected' : ''}>💬 洽談中</option>
                <option value="已拜訪" ${c.status === '已拜訪' ? 'selected' : ''}>✅ 已拜訪</option>
              </select>
            </div>

            <div style="display:flex; gap:6px;">
              <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="editNotes(${c.id}, event)" title="修改備忘錄">
                ✏️ 備忘
              </button>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.address)}" 
                 target="_blank" 
                 class="nav-btn" 
                 onclick="event.stopPropagation();" 
                 title="開啓 Google Maps 導航">
                🚗 導航
              </a>
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          focusOnClient(c);
        });

        container.appendChild(card);
      });
    }

    // --- Card & Map Interaction ---
    function focusOnClient(c) {
      highlightClientCard(c.id);

      if (markers[c.id]) {
        map.flyTo([c.lat, c.lng], 17, { duration: 1 });
        markers[c.id].openPopup();
      }
    }

    function highlightClientCard(id) {
      document.querySelectorAll('.client-card').forEach(el => el.classList.remove('active'));
      const targetCard = document.getElementById(`card-${id}`);
      if (targetCard) {
        targetCard.classList.add('active');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // --- Update Status & Notes ---
    window.changeClientStatus = function(id, newStatus, event) {
      event.stopPropagation();
      const client = clients.find(c => c.id === id);
      if (client) {
        client.status = newStatus;
        saveData();
        renderList();
      }
    };

    window.editNotes = function(id, event) {
      event.stopPropagation();
      const client = clients.find(c => c.id === id);
      if (!client) return;

      const newNote = prompt(`請輸入【${client.name}】的拜訪備忘或需求備註：`, client.notes || "");
      if (newNote !== null) {
        client.notes = newNote.trim();
        saveData();
        const noteSpan = document.getElementById(`note-text-${id}`);
        if (noteSpan) noteSpan.innerText = client.notes || '尚未填寫拜訪紀錄';
      }
    };

    function updateBadgeCounts() {
      document.getElementById('countAll').innerText = clients.length;
      document.getElementById('countListed').innerText = clients.filter(c => c.is_listed === '是').length;
      document.getElementById('countPending').innerText = clients.filter(c => c.status === '尚未拜訪' || c.status === '待拜訪').length;
      document.getElementById('countNegotiating').innerText = clients.filter(c => c.status === '洽談中').length;
      document.getElementById('countDone').innerText = clients.filter(c => c.status === '已拜訪').length;
    }

    // --- Dynamic Road Chips ---
    function setupRoadChips() {
      // 提取目前資料中所有的路名
      const roads = ["ALL", ...new Set(clients.map(c => c.road).filter(Boolean))];
      const roadContainer = document.getElementById('roadChips');
      roadContainer.innerHTML = "";

      roads.forEach(r => {
        const btn = document.createElement('button');
        btn.className = `chip ${activeRoad === r ? 'active' : ''}`;
        btn.innerText = r === "ALL" ? "全部路段" : r;
        btn.onclick = () => {
          document.querySelectorAll('#roadChips .chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          activeRoad = r;
          renderList();
        };
        roadContainer.appendChild(btn);
      });
    }

    // --- Event Listeners ---
    document.addEventListener("DOMContentLoaded", () => {
      initData();
      initMap();
      setupRoadChips();
      renderList();

      // Search input with debounce
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderList();
      });

      // Status Filter Chips
      document.querySelectorAll('#statusChips .chip-status').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#statusChips .chip-status').forEach(b => {
            b.className = "chip chip-status";
          });
          const status = btn.getAttribute('data-status');
          activeStatus = status;

          if (status === "ALL") btn.classList.add('active-all');
          else if (status === "LISTED") btn.classList.add('active-listed');
          else if (status === "尚未拜訪" || status === "待拜訪") btn.classList.add('active-pending');
          else if (status === "洽談中") btn.classList.add('active-negotiating');
          else if (status === "已拜訪") btn.classList.add('active-done');

          renderList();
        });
      });

      // Reset Filter Button
      document.getElementById('btnResetFilter').addEventListener('click', () => {
        searchQuery = "";
        searchInput.value = "";
        activeRoad = "ALL";
        activeStatus = "ALL";
        setupRoadChips();
        document.querySelectorAll('#statusChips .chip-status').forEach(b => b.className = "chip chip-status");
        document.querySelector('[data-status="ALL"]').classList.add('active-all');
        renderList();
      });

      // Locate User GPS (外勤業務神功能)
      document.getElementById('btnLocateMe').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert("您的設備或瀏覽器不支援 GPS 定位");
          return;
        }

        const btn = document.getElementById('btnLocateMe');
        btn.innerText = "⏳ 定位中...";

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            btn.innerText = "🎯 我的位置";
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (userLocationMarker) {
              map.removeLayer(userLocationMarker);
            }

            const meIcon = L.divIcon({
              html: `<div style="background:#2563EB; width:20px; height:20px; border-radius:50%; border:3px solid #FFF; box-shadow:0 0 0 8px rgba(37,99,235,0.25);"></div>`,
              className: '',
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            });

            userLocationMarker = L.marker([lat, lng], { icon: meIcon }).addTo(map);
            userLocationMarker.bindPopup("<b>📍 您的目前位置</b>").openPopup();
            map.flyTo([lat, lng], 16);
          },
          (err) => {
            btn.innerText = "🎯 我的位置";
            alert("無法取得 GPS 定位，請確認手機已允許瀏覽器定位權限。");
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });

      // Fit bounds
      document.getElementById('btnFitBounds').addEventListener('click', () => {
        const bounds = L.latLngBounds(clients.map(c => [c.lat, c.lng]));
        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      });

      // Export CSV
      document.getElementById('btnExport').addEventListener('click', () => {
        let csvContent = "\uFEFFid,name,road,address,lat,lng,industry,is_listed,status,contact,phone,notes\n";
        clients.forEach(c => {
          const row = [
            c.id,
            `"${(c.name || '').replace(/"/g, '""')}"`,
            `"${(c.road || '').replace(/"/g, '""')}"`,
            `"${(c.address || '').replace(/"/g, '""')}"`,
            c.lat,
            c.lng,
            `"${(c.industry || '').replace(/"/g, '""')}"`,
            c.is_listed || "否",
            `"${(c.status || '尚未拜訪')}"`,
            `"${(c.contact || '').replace(/"/g, '""')}"`,
            `"${(c.phone || '').replace(/"/g, '""')}"`,
            `"${(c.notes || '').replace(/"/g, '""')}"`
          ].join(",");
          csvContent += row + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `業務拜訪記錄_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Import CSV
      const fileInput = document.getElementById('fileInput');
      document.getElementById('btnImport').addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          parseAndImportCSV(text);
        };
        reader.readAsText(file);
      });

      // Modal Add Client
      const modal = document.getElementById('modalAdd');
      document.getElementById('btnAddClient').addEventListener('click', () => {
        modal.classList.add('open');
      });
      document.getElementById('btnCloseModal').addEventListener('click', () => {
        modal.classList.remove('open');
      });

      document.getElementById('formAddClient').addEventListener('submit', (e) => {
        e.preventDefault();
        const newClient = {
          id: Date.now(),
          name: document.getElementById('addName').value.trim(),
          road: document.getElementById('addRoad').value.trim(),
          address: document.getElementById('addAddress').value.trim(),
          lat: parseFloat(document.getElementById('addLat').value) || 24.9818,
          lng: parseFloat(document.getElementById('addLng').value) || 121.2385,
          industry: "自建客戶",
          is_listed: document.getElementById('addListed').value,
          status: "尚未拜訪",
          contact: document.getElementById('addContact').value.trim(),
          phone: document.getElementById('addPhone').value.trim(),
          notes: document.getElementById('addNotes').value.trim()
        };

        clients.unshift(newClient);
        saveData();
        setupRoadChips();
        renderList();
        modal.classList.remove('open');
        document.getElementById('formAddClient').reset();
        focusOnClient(newClient);
      });
    });

    // Helper: Parse CSV
    function parseAndImportCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length <= 1) {
        alert("CSV 內容為空或格式不符");
        return;
      }

      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
      const imported = [];

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(",").map(val => val.trim().replace(/^"|"$/g, ''));
        if (row.length < 5) continue;

        imported.push({
          id: Date.now() + i,
          name: row[1] || `客戶 ${i}`,
          road: row[2] || "園區內",
          address: row[3] || "",
          lat: parseFloat(row[4]) || 24.9818,
          lng: parseFloat(row[5]) || 121.2385,
          industry: row[6] || "其他",
          is_listed: row[7] || "否",
          status: row[8] || "尚未拜訪",
          contact: row[9] || "",
          phone: row[10] || "",
          notes: row[11] || ""
        });
      }

      if (imported.length > 0) {
        if (confirm(`成功解析出 ${imported.length} 筆客戶名單！是否要覆蓋目前名單？（選取消則為追加名單）`)) {
          clients = imported;
        } else {
          clients = [...imported, ...clients];
        }
        saveData();
        setupRoadChips();
        renderList();
        alert("名單匯入成功！");
      } else {
        alert("解析 CSV 失敗，請確認欄位格式是否與範本一致。");
      }
    }
  </script>
</body>
</html>
